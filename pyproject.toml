[project]
dependencies = [
  # Not imported directly: transformers.Trainer (scripts/train/py/train.py)
  # pulls it in at runtime.
  "accelerate>=1.15.0",
  "numpy>=2.5.3", # Not imported directly: torch.onnx.export(dynamo=True) in
  # scripts/train/py/export_onnx.py needs it at runtime.
  "onnx>=1.22.0",
  "onnxruntime>=1.30.0",
  "ruff>=0.16.7",
  "scikit-learn>=1.9.1",
  "torch>=2.14.0",
  "transformers>=5.17.0",
]
description = "Yukino Agent2 Python Force"
name = "yukino-agent2"
readme = "README.md"
requires-python = ">=3.13"
version = "0.0.0"

# uv syncs the dependencies but never builds/installs this repo as a Python package (it is a Node
# project). The remaining Python subtree is scripts run in place, e.g. `uv run python
# scripts/train/py/train.py` (see the main.js tasks).
[tool.uv]
package = false

[tool.ruff]
extend-exclude = [".agents"]

# Default rules (E4/E7/E9/F) plus import sorting and the modernization/bugbear/async rules.
# E501 stays off: line width is `ruff format`'s job, and the pre-existing
# training comments intentionally exceed the format width.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing training scripts use `l` as a jsonl-line loop variable; kept as authored.
"scripts/train/py/*.py" = ["E741"]

# Strict typing for the vendored train training pipeline (scripts/train/py). Scoped via `files`
# so a bare `mypy` run targets only this typed subtree and leaves the other loose scripts alone.
[tool.mypy]
files = ["scripts/train/py"]
python_version = "3.13"
strict = true

# scikit-learn and onnxruntime ship no py.typed marker / stubs; treat them as Any at the boundary.
[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["sklearn.*", "onnxruntime.*"]
